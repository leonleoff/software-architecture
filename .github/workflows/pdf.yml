name: Build PDFs

# Every push compiles all exercise-*/ documents (same TeX Live image as the
# dev container). Pushes to main also replace the rolling "latest" release,
# so the current PDFs are always at Releases -> latest; nothing is committed
# back to the repo. Other branches get the PDFs as a workflow artifact.

on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile LaTeX
        run: sh build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: dist/*.pdf
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdfs
          path: dist
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.pdf \
            --target "$GITHUB_SHA" \
            --title "Latest PDFs" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
